<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rocket focus — coming soon</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: monospace;
            font-size: 13px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: white;
            text-align: center;
            padding: 20px;
        }

        .container { max-width: 420px; }

        h1 {
            font-weight: normal;
            font-size: 13px;
            margin-bottom: 16px;
            color: #000;
        }

        p {
            font-size: 13px;
            color: #555;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        a {
            font-family: monospace;
            font-size: 13px;
            color: #000;
            text-decoration: none;
        }

        a:hover { text-decoration: underline; }

        #back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 13px;
            color: #aaa;
        }
        #back-btn:hover { color: #000; }

        .label {
            font-size: 11px;
            color: #aaa;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <a id="back-btn" href="/">← back</a>
    <div class="container">
        <h1>rocket focus</h1>
        <p>study timer where you pilot a rocket through space.<br>focus longer, go further.</p>
        <div class="label">dropping soon</div>
        <p style="margin-top:24px;"><a href="/">get notified →</a></p>
    </div>
</body>
</html>
