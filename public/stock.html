<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0x45 corp</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: monospace;
            font-size: 13px;
            background: #fff;
            color: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }

        a { color: #000; }

        #back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 13px;
            color: #aaa;
            text-decoration: none;
        }
        #back-btn:hover { color: #000; }

        .wrap {
            width: 100%;
            max-width: 560px;
            text-align: center;
        }

        .thanks {
            font-size: 11px;
            color: #aaa;
            margin-bottom: 60px;
        }

        .holders {
            font-size: 13px;
            margin-bottom: 20px;
        }

        #chart {
            width: 100%;
            height: auto;
            display: block;
            overflow: visible;
        }

        .bar-hit { cursor: crosshair; }

        .foot {
            margin-top: 28px;
            font-size: 11px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <a id="back-btn" href="/">← back</a>

    <div class="wrap">
        <p class="thanks">thank you for investing in 0x45 corp</p>
        <p class="holders">11,067</p>
        <svg id="chart" viewBox="0 0 560 210" preserveAspectRatio="xMidYMid meet" aria-label="x payouts"></svg>
        <p class="foot">followers are like shareholders.</p>
    </div>

<script>
(function () {
    const TIP_GAP = 30;

    function fmtMoney(n) {
        return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function drawChart(payouts) {
        const svg = document.getElementById('chart');
        const W = 560;
        const H = 210;
        const pad = { t: 42, r: 44, b: 4, l: 44 };
        const innerW = W - pad.l - pad.r;
        const innerH = H - pad.t - pad.b;
        const n = payouts.length;
        const gap = 2;
        const barW = Math.max(2, (innerW - gap * (n - 1)) / n);
        const max = Math.max(...payouts.map(p => p.payout));

        svg.innerHTML = '';
        svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);

        const baseline = pad.t + innerH;
        const highestTop = baseline - innerH;
        const tipX = W / 2;
        const tipY = highestTop - TIP_GAP;

        const axis = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        axis.setAttribute('x1', pad.l);
        axis.setAttribute('y1', baseline);
        axis.setAttribute('x2', W - pad.r);
        axis.setAttribute('y2', baseline);
        axis.setAttribute('stroke', '#eee');
        axis.setAttribute('stroke-width', '1');
        svg.appendChild(axis);

        const tip = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        tip.setAttribute('text-anchor', 'middle');
        tip.setAttribute('font-family', 'monospace');
        tip.setAttribute('font-size', '9');
        tip.setAttribute('fill', '#aaa');
        tip.setAttribute('x', tipX);
        tip.setAttribute('y', tipY);
        tip.setAttribute('visibility', 'hidden');
        svg.appendChild(tip);

        payouts.forEach((p, i) => {
            const h = (p.payout / max) * innerH;
            const x = pad.l + i * (barW + gap);
            const y = baseline - h;
            const last = i === n - 1;

            const bar = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            bar.setAttribute('x', x);
            bar.setAttribute('y', y);
            bar.setAttribute('width', barW);
            bar.setAttribute('height', h);
            bar.setAttribute('fill', last ? '#000' : '#ddd');
            svg.appendChild(bar);

            const hit = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            hit.setAttribute('class', 'bar-hit');
            hit.setAttribute('x', x);
            hit.setAttribute('y', pad.t);
            hit.setAttribute('width', barW);
            hit.setAttribute('height', innerH);
            hit.setAttribute('fill', 'transparent');

            hit.addEventListener('mouseenter', () => {
                tip.textContent = fmtMoney(p.payout);
                tip.setAttribute('visibility', 'visible');
                bar.setAttribute('fill', last ? '#333' : '#bbb');
            });

            hit.addEventListener('mouseleave', () => {
                tip.setAttribute('visibility', 'hidden');
                bar.setAttribute('fill', last ? '#000' : '#ddd');
            });

            svg.appendChild(hit);
        });
    }

    fetch('/.netlify/functions/stock')
        .then(r => { if (!r.ok) throw new Error('stock ' + r.status); return r.json(); })
        .then(data => drawChart(data.payouts || []))
        .catch(err => console.error('[stock]', err));
})();
</script>
</body>
</html>
